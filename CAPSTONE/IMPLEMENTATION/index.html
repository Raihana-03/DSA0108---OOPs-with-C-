<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost and Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Campus Lost &amp; Found</h1>
    <p>Find what you lost. Return what you found.</p>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Report an Item</h2>
      <form id="itemForm">
        <label for="itemName">Item name</label>
        <input id="itemName" name="itemName" type="text" placeholder="e.g. Blue water bottle" required>

        <label for="itemType">Item type</label>
        <select id="itemType" name="itemType">
          <option value="Lost">Lost item</option>
          <option value="Found">Found item</option>
        </select>

        <label for="location">Location</label>
        <input id="location" name="location" type="text" placeholder="e.g. Library" required>

        <button type="submit">Submit Report</button>
      </form>
    </section>

    <section class="panel">
      <h2>Reported Items</h2>
      <div id="itemList" aria-live="polite">
        <p class="empty">No items reported yet.</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
